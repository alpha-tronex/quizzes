<section class="masthead bg-primary text-white text-center">
  <div class="container">
    <app-admin-breadcrumb></app-admin-breadcrumb>

    <h2 class="mb-4">{{ isEditMode ? 'Edit Cohort' : 'Create Cohort' }}</h2>

    <div *ngIf="loading" class="text-center py-5">
      <div class="spinner-border text-white" role="status">
        <span class="sr-only">Loading...</span>
      </div>
      <p class="mt-3">Loading...</p>
    </div>

    <div *ngIf="!loading" class="card text-dark">
      <div class="card-body text-start">
        <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show">
          <i class="fas fa-check-circle"></i> {{ successMessage }}
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show">
          <i class="fas fa-exclamation-circle"></i> {{ errorMessage }}
        </div>

        <!-- Cohort Details -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="cohortName" class="form-label fw-bold">
              <i class="fas fa-layer-group"></i> Cohort Name *
            </label>
            <input type="text" class="form-control" id="cohortName" [(ngModel)]="name"
              placeholder="e.g. Fall 2026 Cohort" [disabled]="isSubmitting">
          </div>
          <div class="col-md-3 mb-3">
            <label for="startDate" class="form-label fw-bold">
              <i class="fas fa-calendar-day"></i> Start Date *
            </label>
            <input type="date" class="form-control" id="startDate" [(ngModel)]="startDate" [disabled]="isSubmitting">
          </div>
          <div class="col-md-3 mb-3">
            <label for="endDate" class="form-label fw-bold">
              <i class="fas fa-calendar-check"></i> End Date *
            </label>
            <input type="date" class="form-control" id="endDate" [(ngModel)]="endDate" [disabled]="isSubmitting">
          </div>
        </div>

        <div class="row mt-3">
          <!-- Student Picker -->
          <div class="col-md-6 mb-4">
            <label class="form-label fw-bold">
              <i class="fas fa-user-graduate"></i> Students ({{ selectedStudentCount }} selected)
            </label>
            <input type="text" class="form-control mb-2" placeholder="Search students..."
              [(ngModel)]="studentSearch" [disabled]="isSubmitting">
            <div class="border rounded p-2" style="max-height: 320px; overflow-y: auto;">
              <div *ngIf="filteredStudents.length === 0" class="text-muted text-center py-3">
                No students found.
              </div>
              <div class="form-check" *ngFor="let student of filteredStudents">
                <input type="checkbox" class="form-check-input" [id]="'student-' + student.id"
                  [checked]="isStudentSelected(student.id)" (change)="toggleStudent(student.id)"
                  [disabled]="isSubmitting">
                <label class="form-check-label" [for]="'student-' + student.id">
                  {{ student.fname }} {{ student.lname }} <span class="text-muted">({{ student.uname }})</span>
                </label>
              </div>
            </div>
          </div>

          <!-- Quiz Picker -->
          <div class="col-md-6 mb-4">
            <label class="form-label fw-bold">
              <i class="fas fa-question-circle"></i> Quizzes ({{ selectedQuizCount }} selected)
            </label>
            <div class="border rounded p-2" style="max-height: 320px; overflow-y: auto; margin-top: 2.5rem;">
              <div *ngIf="quizzes.length === 0" class="text-muted text-center py-3">
                No quizzes available.
              </div>
              <div class="form-check" *ngFor="let quiz of quizzes">
                <input type="checkbox" class="form-check-input" [id]="'quiz-' + quiz.id"
                  [checked]="isQuizSelected(quiz.id)" (change)="toggleQuiz(quiz.id)"
                  [disabled]="isSubmitting">
                <label class="form-check-label" [for]="'quiz-' + quiz.id">
                  {{ quiz.title }}
                </label>
              </div>
            </div>
          </div>
        </div>

        <div class="d-flex justify-content-end">
          <button type="button" class="btn btn-secondary me-2" (click)="cancel()" [disabled]="isSubmitting">
            Cancel
          </button>
          <button type="button" class="btn btn-success" (click)="save()" [disabled]="isSubmitting">
            <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-1"></span>
            <i *ngIf="!isSubmitting" class="fas fa-save"></i>
            {{ isEditMode ? 'Save Changes' : 'Create Cohort' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
